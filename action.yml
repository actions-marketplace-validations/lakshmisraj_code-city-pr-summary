name: Code City PR summary
description: "Comments on each pull request with hotspots, missing tests and who to ask, plus a link to see it in Code City's 3D view."
author: Lakshmi Shibu Raj
branding:
  icon: map
  color: orange
inputs:
  github-token:
    description: "Token used to post the comment. The default works when the workflow grants `pull-requests: write`."
    default: ${{ github.token }}
  quiet:
    description: "Only comment when something is worth flagging (a hotspot, missing tests, or a reviewer hint). Overrides `quiet` in .codecity.yml."
    default: ""
  history-days:
    description: "How many days of history count towards hotspots and owners. Overrides `history-days` in .codecity.yml (default 365)."
    default: ""
  config:
    description: "Path of the settings file, read from the base branch."
    default: ".codecity.yml"
  site:
    description: "Code City site the comment links to."
    default: https://code-city-view.netlify.app
runs:
  using: composite
  steps:
    - shell: bash
      # Never fail the build: without Python 3.7+ on the runner, warn and skip.
      run: |
        if ! command -v python3 >/dev/null || ! python3 -c 'import sys; sys.exit(sys.version_info < (3, 7))'; then
          echo "::warning::Code City summary skipped: it needs Python 3.7 or newer on the runner (add actions/setup-python)."
          exit 0
        fi
        python3 "${{ github.action_path }}/action/pr_comment.py"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CODE_CITY_QUIET: ${{ inputs.quiet }}
        CODE_CITY_DAYS: ${{ inputs.history-days }}
        CODE_CITY_CONFIG: ${{ inputs.config }}
        CODE_CITY_SITE: ${{ inputs.site }}
